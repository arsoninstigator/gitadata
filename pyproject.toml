[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitadata"
version = "0.1.0"
description = "deterministic commit metadata rewriting for pushed repositories"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
dev = []

[project.scripts]
gitadata = "gitadata.cli:main"

[tool.setuptools]
packages = ["gitadata"]

[tool.setuptools.package-data]
gitadata = ["web/*"]
